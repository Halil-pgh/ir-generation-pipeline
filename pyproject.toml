[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "irpipe"
dynamic = ["version"]
description = "Turns a frame brief into a picture through a library-independent IR (Manim, SVG backends)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "shapely>=2.0",                # the front-end's geometry core: regions, flood_fill, clip
]

[project.scripts]
irpipe = "irpipe.cli:main"

[project.optional-dependencies]
# Each extra belongs to one layer, so a layer's heavy dependency is only
# installed when that layer is used.
svg = ["cairosvg>=2.7"]           # SVG reference backend: frame.svg -> frame.png (step 7)
pango = ["pangocffi>=0.14", "pangocairocffi>=0.7"]   # text measured as Manim draws it (step 10)
# Manim backend, pinned as the analysis asks (step 15); Pango tells it where a text's ink lies.
manim = ["manim==0.22.1", "pangocffi>=0.14", "pangocairocffi>=0.7"]
# Exact values in build_ir.py (step 20): irkit writes sympy numbers as expressions; it does
# not import sympy itself, the scripts the agent writes do.
irkit = ["sympy>=1.13"]
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23", "types-jsonschema",
    "types-shapely",
]

[tool.setuptools.dynamic]
version = { attr = "irpipe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irpipe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "manim: needs Manim and LaTeX installed (slow)",
    "llm: calls the real language model and uses the subscription; runs only with IRPIPE_LLM=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Newer ruff also formats Python inside Markdown; the docs (PLAN.md is an export
# of the team's plan) keep their code blocks as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true   # tests/a/conftest.py and tests/b/conftest.py are different modules
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
