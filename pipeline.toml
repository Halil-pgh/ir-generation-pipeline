# The shape of the pipeline. This file, not the code, decides what runs.
#
# - Add a stage: write its file in a plugin package, then add its name below.
# - Remove a stage: delete its name. If a later stage needs an artifact that
#   only the removed stage produced, the pipeline refuses to start and names both.
# - Settings for one stage go in an [options.<stage>] table; it reaches the
#   stage as ctx.options. A switched-off stage may keep its table.

[pipeline]
stages = ["validate", "normalize", "measure", "resolve", "render"]   # in run order
# "check_header" (after validate) compares the IR's header with the locked one. It needs
# the locked header as an input, so the orchestrator adds it (step 19), not this file.
plugins = ["irpipe.frontend", "irpipe.metrics", "irpipe.backends"]  # packages that register plugins

[options.measure]
metrics = "pango"   # text through Pango and formulas through LaTeX, as Manim draws them;
                    # "fixed" needs no fonts and no LaTeX (formulas then cannot be drawn)
# cache_dir = ""    # where typeset formulas are kept; default ~/.cache/irpipe/metrics

[options.render]
backend = "svg"     # which backend draws the LIR

[options.render.svg]
png = true          # also rasterize frame.svg to frame.png (needs the svg extra)
