# The shape of the pipeline. This file, not the code, decides what runs.
#
# - Add a stage: write its file in a plugin package, then add its name below.
# - Remove a stage: delete its name. If a later stage needs an artifact that
#   only the removed stage produced, the pipeline refuses to start and names both.
# - Settings for one stage go in an [options.<stage>] table; it reaches the
#   stage as ctx.options. A switched-off stage may keep its table.

[pipeline]
stages = ["validate", "normalize", "measure", "place", "resolve", "check", "render"]  # in run order
# "check_header" (after validate) compares the IR's header with the locked one. It needs
# the locked header as an input, so the orchestrator adds it (step 19), not this file.
plugins = [  # packages that register plugins
    "irpipe.frontend", "irpipe.components", "irpipe.metrics", "irpipe.checks", "irpipe.backends",
]

[options.measure]
metrics = "pango"   # text through Pango and formulas through LaTeX, as Manim draws them;
                    # "fixed" needs no fonts and no LaTeX (formulas then cannot be drawn)
# cache_dir = ""    # where typeset formulas are kept; default ~/.cache/irpipe/metrics

[options.check]
# Which checks run, in order. Delete a name to switch that check off.
checks = [
    "offscreen",        # W-OFFSCREEN       nothing past the edge of the frame
    "safe_area",        # W-UNSAFE          everything inside the safe area
    "subtitle",         # E-SUBTITLE        nothing in the subtitle band
    "text_overlap",     # W-TEXT-OVERLAP    no text on top of another
    "text_crossed",     # W-TEXT-CROSSED    no line through a text
    "contrast",         # W-LOW-CONTRAST    text stands out from what is behind it
    "text_size",        # W-SMALL-TEXT      no text too small to read
    "similar_colors",   # W-SIMILAR-COLORS  colors that can be told apart
    "fill_overlap",     # W-FILL-OVERLAP    no accidental partial overlap of fills
    "group_opacity",    # W-GROUP-OPACITY   a faded group's children do not overlap
    "glyphs",           # W-MISSING-GLYPH   every character is in the font
]

[options.check.contrast]
min_ratio = 4.5     # WCAG AA for text
large_ratio = 3.0   # WCAG AA for large text
large_size = 48     # reference px from which a text is large

[options.check.text_size]
min_size = 28       # reference px (a caption is 34)

[options.check.similar_colors]
min_delta_e = 10    # CIEDE2000; about 1 is just noticeable side by side

[options.render]
backend = "manim"   # which backend draws the LIR: "manim", or "svg" (the fast reference)

[options.render.svg]
png = true          # also rasterize frame.svg to frame.png (needs the svg extra)

[options.render.manim]
png = true          # draw frame.png with Manim; false writes only scene.py (needs the manim extra)
timeout = 300       # seconds Manim may take to draw the picture
# cache_dir = ""    # where Manim keeps typeset formulas and texts; default ~/.cache/irpipe/manim

[agent]
# The IR agent (irpipe agent brief.json): a language model writes build_ir.py with our tools.
provider = "claude-cli"         # claude -p, on the team's subscription (decision K9)
model = "claude-haiku-5-5"      # "" leaves the model to the provider
max_turns = 3                   # submissions; each is compiled and drawn, the best one is kept
max_calls = 30                  # messages the model may write in one session
sandbox = "auto"                # where build_ir.py runs: "bwrap" where the system allows it,
                                # else "audit" (limits and an audit hook); "none" for no sandbox
# effort = ""                   # how hard the model thinks: "low" ... "max"; "" its default
# script_timeout = 120          # seconds build_ir.py may run
# example = "examples/tangents/build_ir.py"   # the whole script the system prompt shows
